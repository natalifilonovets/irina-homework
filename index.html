:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#203d40;background:#123b40;font-synthesis:none}*{box-sizing:border-box}body{margin:0}body::before{content:"";position:fixed;width:540px;height:540px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#f2d79b,#d3b26f 38%,#377e80 70%,#17494e);top:-250px;right:-120px;box-shadow:0 0 100px #d5936b26;pointer-events:none}body::after{content:"";position:fixed;width:330px;height:330px;border:55px solid #6ba7a4;border-radius:50%;bottom:-170px;left:-120px;transform:rotate(-25deg);box-shadow:inset 12px 12px 24px #15101e70,12px 12px 40px #130d2270;pointer-events:none}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #3b9d8c;outline-offset:5px}.wrap{min-height:100svh;display:grid;place-items:center;padding:70px 30px;position:relative;z-index:1;overflow:hidden}.card{width:100%;max-width:780px;padding:38px 48px 30px;border-radius:26px;background:#fffaf0;position:relative;box-shadow:0 30px 90px #0c061c55,0 2px 0 #ffffff80 inset;isolation:isolate}.card::before{content:"";position:absolute;inset:0;border-radius:26px;background:#76b6ae;transform:rotate(-3deg);z-index:-2;box-shadow:0 16px 45px #110a2026}.card::after{content:"";position:absolute;inset:0;border-radius:26px;background:#fffaf0;z-index:-1}.topline{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;color:#607c7c;font-variant-numeric:tabular-nums}.topline>span{border:1px solid #ceded8;padding:9px 14px;border-radius:24px;background:#edf4ef}.progress{width:108px;height:5px;background:#dbe8e2;border-radius:4px;overflow:hidden}.progress i{display:block;height:100%;background:#27877f;transition:width .3s;border-radius:4px}.sentence{font-size:clamp(27px,3.5vw,37px);font-weight:550;line-height:1.48;letter-spacing:-1.1px;margin:42px 0 36px;min-height:130px}.blank{color:#16796f;white-space:nowrap;border-bottom:3px solid #85bcb0;padding:0 5px}.options{display:grid;grid-template-columns:1fr 1fr;gap:14px}.option{position:relative;background:#dceee7;border:1px solid #9ac9ba;border-radius:15px;padding:25px 38px 25px 22px;text-align:left;font-size:19px;font-weight:550;color:#20594f;box-shadow:0 4px 0 #a6cdbf;transition:background .18s,transform .18s,box-shadow .18s}.option::after{content:"↗";position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:22px;font-weight:400;color:#508a7b}.option:nth-child(2){background:#f3e6c8;border-color:#ddc995;color:#725c2d;box-shadow:0 4px 0 #d9c491}.option:nth-child(2)::after{color:#a28b51}.option:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 7px 0 #a6cdbf;background:#cce4d9}.option:nth-child(2):hover:not(:disabled){background:#eddaad;box-shadow:0 7px 0 #d9c491}.option:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #a6cdbf}.option.correct{background:#e0edc5;border-color:#acc482;color:#3e582b;box-shadow:0 4px 0 #b7c999}.option.wrong{background:#f3d7d2;border-color:#d7a59d;color:#8b4b45;box-shadow:0 4px 0 #d7aaa3}.option:disabled{cursor:default;opacity:1}.option:disabled::after{display:none}.feedback{margin-top:26px;padding:18px 20px;background:#eaf2e9;border-left:3px solid #71aa97;border-radius:0 12px 12px 0;font-size:14px;color:#516e63;line-height:1.75;animation:appear .25s ease}.feedback strong{display:block;color:#275748;font-weight:600;margin-bottom:4px}.actions{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-top:30px;min-height:47px}.primary{background:#20584f;border:0;border-radius:25px;padding:14px 24px;color:#faf5ee;font-size:14px;transition:transform .2s,background .2s}.primary:hover{background:#317b6c;transform:translateX(2px)}.textbtn{background:none;border:0;padding:12px 0;font-size:13px;color:#658478}.textbtn:hover{color:#376b59}.textbtn:disabled{visibility:hidden}.result .score{font-size:90px;font-weight:500;letter-spacing:-5px;color:#16796f;margin:14px 0 26px}.result .score span{font-size:30px;color:#8cae9f;letter-spacing:0}.result h2{font-size:18px;font-weight:500;margin:8px 0;color:#5d8070}.review{font-size:14px;line-height:1.8;border-top:1px solid #d6e3d7;padding:21px 0}.review b{font-size:17px;font-weight:600;color:#16796f}.review p{margin:8px 0;color:#5f796a}@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}@media(max-width:560px){.wrap{padding:55px 22px}.card{padding:26px 24px 22px;border-radius:22px}.card::before,.card::after{border-radius:22px}.sentence{margin:30px 0;min-height:145px;letter-spacing:-.6px;font-size:28px}.options{grid-template-columns:1fr;gap:16px}.option{padding:21px 40px 21px 21px;font-size:18px}.actions{margin-top:26px}.feedback{font-size:13px;padding:15px}.topline>span{padding:7px 12px}body::before{width:350px;height:350px;top:-190px;right:-150px}body::after{width:230px;height:230px;bottom:-180px;border-width:35px}.result .score{font-size:74px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
