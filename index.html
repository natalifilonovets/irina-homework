.options{display:grid;grid-template-columns:1fr 1fr;gap:14px}.option{position:relative;background:#e6dcf0;border:1px solid #cdbbdf;border-radius:15px;padding:25px 38px 25px 22px;text-align:left;font-size:19px;font-weight:550;color:#4d365f;box-shadow:0 4px 0 #cebedc;transition:background .18s,transform .18s,box-shadow .18s}.option::after{content:"↗";position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:22px;font-weight:400;color:#9175a7}.option:nth-child(2){background:#f2dfcf;border-color:#e3c3aa;color:#76513b;box-shadow:0 4px 0 #dec0a9}.option:nth-child(2)::after{color:#b38c70}.option:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 7px 0 #cebedc;background:#dbcaeb}.option:nth-child(2):hover:not(:disabled){background:#ecd0b8;box-shadow:0 7px 0 #dec0a9}.option:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #cebedc}.option.correct{background:#e0edc5;border-color:#acc482;color:#3e582b;box-shadow:0 4px 0 #b7c999}.option.wrong{background:#f3d7d2;border-color:#d7a59d;color:#8b4b45;box-shadow:0 4px 0 #d7aaa3}.option:disabled{cursor:default;opacity:1}.option:disabled::after{display:none}.feedback{margin-top:26px;padding:18px 20px;background:#eee8ef;border-left:3px solid #ad91c4;border-radius:0 12px 12px 0;font-size:14px;color:#71647b;line-height:1.75;animation:appear .25s ease}.feedback strong{display:block;color:#493254;font-weight:600;margin-bottom:4px}.actions{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-top:30px;min-height:47px}.primary{background:#382944;border:0;border-radius:25px;padding:14px 24px;color:#faf5ee;font-size:14px;transition:transform .2s,background .2s}.primary:hover{background:#644777;transform:translateX(2px)}.textbtn{background:none;border:0;padding:12px 0;font-size:13px;color:#998a9f}.textbtn:hover{color:#624b71}.textbtn:disabled{visibility:hidden}.result .score{font-size:90px;font-weight:500;letter-spacing:-5px;color:#8053a0;margin:14px 0 26px}.result .score span{font-size:30px;color:#b5a5bf;letter-spacing:0}.result h2{font-size:18px;font-weight:500;margin:8px 0;color:#7d688b}.review{font-size:14px;line-height:1.8;border-top:1px solid #e2d9e7;padding:21px 0}.review b{font-size:17px;font-weight:600;color:#8053a0}.review p{margin:8px 0;color:#74687d}@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}@media(max-width:560px){.wrap{padding:55px 22px}.card{padding:26px 24px 22px;border-radius:22px}.card::before,.card::after{border-radius:22px}.sentence{margin:30px 0;min-height:145px;letter-spacing:-.6px;font-size:28px}.options{grid-template-columns:1fr;gap:16px}.option{padding:21px 40px 21px 21px;font-size:18px}.actions{margin-top:26px}.feedback{font-size:13px;padding:15px}.topline>span{padding:7px 12px}body::before{width:350px;height:350px;top:-190px;right:-150px}body::after{width:230px;height:230px;bottom:-180px;border-width:35px}.result .score{font-size:74px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
